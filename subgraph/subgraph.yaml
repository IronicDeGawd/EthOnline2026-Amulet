specVersion: 1.0.0
description: Every transaction an agent proposed to an Amulet pendant, and what the wearer decided.
repository: https://github.com/IronicDeGawd/EthOnline2026-Amulet
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AmuletLog
    network: sepolia
    source:
      address: "0x93692bd72a7ebab60436470bb98a6672125fa1ae"
      abi: AmuletLog
      startBlock: 11678432
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Action
        - Agent
        - Target
        - DailyStat
      abis:
        - name: AmuletLog
          file: ./abis/AmuletLog.json
      eventHandlers:
        - event: Action(indexed address,indexed bytes32,indexed address,string,uint256,bytes4,uint8,uint8,uint256)
          handler: handleAction
      file: ./src/mapping.ts
